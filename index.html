<!doctype html>
<!--
  GREEN VALLEY LAYOUT · Interactive 3D master plan (single-file build)

  Run locally : double-click this file, or serve the folder (python -m http.server) and open http://localhost:8000/green-valley-layout.html
  GitHub Pages: rename to index.html, commit to a repository, then Settings → Pages → "Deploy from a branch" (main / root).
  Edit data   : see the "PROJECT DATA" block at the top of the script (plot statuses, columns, roads, contact).

  IMPORTANT: all plot dimensions, statuses, road widths and house concepts are SAMPLE data for illustration.
  They are not survey data, not pricing and not construction drawings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Green Valley Layout · Interactive Master Plan</title>
<meta name="description" content="Explore Green Valley Layout in 3D: select a plot, read its details, visualise a conceptual house and enquire with Mallikarjun N K.">
<meta name="theme-color" content="#1d5c3d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --g9:#0f3523;--g8:#164a31;--g7:#1d5c3d;--g6:#26714c;--g1:#e5efe8;--g0:#f0f5f1;
 --iv:#fbf8f1;--paper:#fffdf9;--ln:#e7e0d1;--ln2:#f0ebe0;--ink:#17221c;--ink2:#37433c;--mut:#6b746d;
 --gold:#b8892f;--gold2:#d6ae5c;--gold0:#f7efdb;
 --av:#3ea84b;--bk:#df9d27;--sd:#cf4438;--wa:#1f8a4c;
 --sh:0 14px 34px rgba(16,36,24,.16),0 2px 6px rgba(16,36,24,.08);--sh2:0 4px 14px rgba(16,36,24,.12);
 --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fd:'Fraunces',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ee;color:var(--ink);font:13px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.card{background:rgba(255,253,249,.97);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}.fine{font-size:11px;color:var(--mut);line-height:1.45}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn .ic{width:16px;height:16px}
.btn-p{background:var(--g7);color:#fff}.btn-p:hover{background:var(--g8)}
.btn-wa{background:var(--wa);color:#fff}.btn-wa:hover{background:#18723e}
.btn-o{background:#fff;border:1px solid var(--ln);color:var(--ink)}.btn-o:hover{border-color:#cdbf9f;background:var(--paper)}
.btn-g{background:var(--gold0);color:#5d4410;border:1px solid #ecdcb4}.btn-g:hover{background:#f2e4c2}
.btn-s{padding:7px 11px;font-size:12px;border-radius:9px}
.btn-b{width:100%}
.ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}.ibtn:hover{background:var(--g0)}

/* top-left */
#tl{position:fixed;top:14px;left:14px;z-index:30;display:flex;gap:10px;align-items:stretch}
.brand{display:flex;align-items:center;gap:11px;padding:8px 16px 8px 8px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,var(--g6),var(--g9));color:#f3e4bd;display:grid;place-items:center;font:600 15px var(--fd);box-shadow:inset 0 0 0 1px rgba(214,174,92,.6)}
.brand h1{margin:0;font:600 16px/1.15 var(--fd);color:var(--g9)}
.brand small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.search{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px}
.search .ic{color:var(--mut)}
.search input{border:0;outline:0;background:none;width:150px;font-size:13.5px;padding:7px 0}
.search input::placeholder{color:#868d87}

/* toolbar */
#tb{position:fixed;top:14px;right:14px;z-index:30;display:flex;align-items:stretch;padding:5px;gap:2px}
#tb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;padding:7px 6px 6px;border-radius:10px;color:var(--ink2);font-size:11px;font-weight:500;position:relative}
#tb button:hover{background:var(--g0)}
#tb button.open{background:var(--gold0);color:#5d4410}
#tb button.on{background:var(--g7);color:#fff}
#tb button[aria-disabled=true]{opacity:.38;cursor:not-allowed}
#tb .sep{width:1px;background:var(--ln);margin:6px 3px}
#tb .badge{position:absolute;top:4px;right:9px;min-width:15px;height:15px;border-radius:8px;background:var(--gold);color:#fff;font-size:9.5px;line-height:15px;font-weight:700;padding:0 4px}

/* popovers */
.pop{position:fixed;top:84px;right:14px;z-index:40;width:330px;padding:16px;max-height:calc(100vh - 104px);overflow:auto}
.pop-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pop-h b{font:600 15px var(--fd);color:var(--g9)}
.fgrp{margin:12px 0}.fl{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{border-color:#c9bd9f}
.chip.on{background:var(--g7);border-color:var(--g7);color:#fff}
.chip.na{border-style:dashed;color:#9aa19b}
.chip.na.on{color:#fff}
.chip small{opacity:.7;font-size:10.5px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--ln2);cursor:pointer;font-weight:500}
.sw input{appearance:none;width:36px;height:21px;border-radius:999px;background:#d8d4ca;position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .15s}
.sw input:checked{background:var(--g7)}.sw input:checked::after{left:18px}
.fres{margin-top:12px;padding:12px;border-radius:12px;background:var(--g0);border:1px solid #dbe7df}
.fres .plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fres .plist button{min-width:34px;padding:4px 7px;border-radius:7px;background:#fff;border:1px solid var(--ln);font-weight:600;font-size:11.5px}
.fres .plist button:hover{border-color:var(--g6);color:var(--g7)}
.empty{text-align:center;padding:16px 8px;color:var(--mut)}
.empty svg{margin:0 auto 6px;width:28px;height:28px;color:#b7ad95}
.sun-time{font:600 30px var(--fd);color:var(--g9);line-height:1}
.sun-phase{color:var(--mut);font-size:12px;margin-top:3px}
input[type=range]{width:100%;accent-color:var(--g7);margin:14px 0 6px}

/* legend */
#legend{position:fixed;left:14px;bottom:14px;z-index:20;display:flex;gap:10px;align-items:flex-end}
.compass{width:66px;height:66px;border-radius:50%;padding:5px}
.compass svg{width:100%;height:100%}
.legend{padding:10px 14px 9px;min-width:166px}
.lg-row{display:flex;align-items:center;gap:9px;padding:2px 0;font-size:12.5px;font-weight:500}
.lg-row b{margin-left:auto;font-variant-numeric:tabular-nums}
.sq{width:11px;height:11px;border-radius:3px;flex:none}
.legend .fine{margin-top:5px;padding-top:6px;border-top:1px solid var(--ln2);max-width:170px}
.legend.off .lg-row{opacity:.45}

/* contact fab */
#fab{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px}
#fab b{display:block;font-size:13px}#fab small{color:var(--mut);font-size:11px}
#fab .ibtn{background:var(--g0);color:var(--g7)}#fab .ibtn.wa{background:var(--wa);color:#fff}
body.has-panel #fab{display:none}

/* panel */
#panel{position:fixed;top:84px;right:14px;bottom:14px;width:390px;z-index:25;overflow:auto;overscroll-behavior:contain;background:var(--iv);scrollbar-width:thin}
.handle{display:none}
.ph{position:sticky;top:0;z-index:2;background:linear-gradient(var(--iv) 85%,rgba(251,248,241,0));padding:16px 16px 10px}
.ph-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pno{font:600 46px/1 var(--fd);color:var(--g9);letter-spacing:-.5px}
.pface{display:flex;align-items:center;gap:7px;margin-top:6px;font-weight:600;color:var(--g7)}
.pface svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.ph-r{display:flex;align-items:center;gap:6px}
.pbody{padding:0 16px 16px}
.sample{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:#6d5622;background:var(--gold0);border:1px solid #efe0bb;border-radius:10px;padding:8px 10px;margin-bottom:12px}
.sample .ic{width:15px;height:15px;margin-top:1px;color:var(--gold)}
.sec{background:var(--paper);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.sec-h h3{margin:0;font:600 15px var(--fd);color:var(--g9)}
.sec-h p{margin:2px 0 0;font-size:11.5px}
.tag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--g0);color:var(--g7);white-space:nowrap}
.tag.gold{background:var(--gold0);color:#6d5622}
.loc{display:grid;grid-template-columns:1fr;gap:8px}
.loc .plan{width:100%;height:160px;border-radius:10px;background:#eef1e6}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.spec{background:var(--paper);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.spec .eyebrow{font-size:9.5px}
.spec b{display:block;font-size:16px;margin-top:3px;color:var(--ink);font-variant-numeric:tabular-nums}
.spec small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.spec.wide{grid-column:1/-1}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ptags span{font-size:11.5px;font-weight:500;background:var(--gold0);color:#6d5622;border:1px solid #efe0bb;border-radius:8px;padding:4px 8px}
.cfg{display:flex;flex-direction:column;gap:9px;margin:4px 0 10px}
.cfg-row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start}
.cfg-l{font-size:11px;font-weight:600;color:var(--mut);padding-top:7px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:#6d5622;background:var(--gold0);border-radius:10px;padding:8px 10px}
.note .ic{width:15px;height:15px;margin-top:1px}
.hsum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 0 8px;border-top:1px solid var(--ln2)}
.hsum b{font-size:14px}.hsum span{font-size:12px;color:var(--mut);text-align:right}
.lvtabs{display:inline-flex;background:var(--g0);border-radius:9px;padding:3px;gap:2px;margin-bottom:8px}
.lvtabs button{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink2)}
.lvtabs button.on{background:#fff;color:var(--g7);box-shadow:0 1px 3px #0001}
.fplan{width:100%;height:auto;display:block;background:#fbfaf5;border:1px solid var(--ln);border-radius:12px}
.fplan text{font-family:var(--f)}
table.rooms{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:12px}
table.rooms th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:4px 0;border-bottom:1px solid var(--ln)}
table.rooms td{padding:5px 0;border-bottom:1px solid var(--ln2);font-variant-numeric:tabular-nums}
table.rooms td:not(:first-child),table.rooms th:not(:first-child){text-align:right}
table.rooms i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;border:1px solid #0001;vertical-align:-1px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .full{grid-column:1/-1}
.seg{display:flex;background:var(--g0);border-radius:10px;padding:3px;gap:2px;margin-top:8px}
.seg button{flex:1;padding:6px 4px;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--g7);box-shadow:0 1px 3px #0001}
.nofit{padding:12px;border-radius:12px;background:#fbf3f1;border:1px solid #f0d9d4;color:#7a3a30;font-size:12px}
.nofit ul{margin:6px 0 0;padding-left:18px}
.person{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--g7);color:#f3e4bd;display:grid;place-items:center;font:600 15px var(--fd)}
.person b{display:block;font-size:14px}.person small{color:var(--mut)}
.cbtns{display:grid;gap:8px}

/* plan view */
#planView{position:fixed;inset:0;z-index:5;background:#f3f0e7;opacity:0;transition:opacity .28s}
#planView.show{opacity:1}
#planView>svg{width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#planView>svg.drag{cursor:grabbing}
.pv-ctl{position:fixed;right:14px;bottom:84px;z-index:21;display:flex;flex-direction:column;padding:4px;gap:2px}
body.has-panel .pv-ctl{right:418px}
.plan text{font-family:var(--f);pointer-events:none}
.plan .pp{cursor:pointer}
.plan .pp:hover rect{filter:brightness(1.07)}
.plan .pp:focus{outline:none}.plan .pp:focus rect{stroke:#b8892f;stroke-width:2}

/* walk HUD */
#wk-top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:31;display:flex;align-items:center;gap:12px;padding:7px 7px 7px 16px;max-width:calc(100vw - 28px)}
#wk-top b{display:block;font-size:13.5px}#wk-top small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#wk-map{position:fixed;left:14px;bottom:14px;width:184px;height:226px;padding:6px;z-index:22}
#wk-map .plan{width:100%;height:100%}
#wk-hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(16,32,22,.84);color:#fff;border-radius:999px;padding:8px 16px;font-size:12px;z-index:22;white-space:nowrap}
#wk-hint kbd{font:600 11px var(--f);background:rgba(255,255,255,.18);border-radius:4px;padding:1px 5px;margin:0 1px}
#joy{position:fixed;left:22px;bottom:22px;width:124px;height:124px;border-radius:50%;background:rgba(255,253,249,.78);border:1px solid var(--ln);box-shadow:var(--sh2);z-index:23;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--g6),var(--g9));box-shadow:0 4px 10px #0003}
body.walking #legend,body.walking #fab{display:none}
body.walking.touch #wk-map{left:auto;right:14px}

/* planner modal */
#planner{position:fixed;inset:0;z-index:50;background:rgba(12,24,17,.5);display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
.pl-card{width:min(1140px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--iv);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.pl-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 14px;background:var(--iv);border-bottom:1px solid var(--ln)}
.pl-head h2{margin:2px 0 0;font:600 22px var(--fd);color:var(--g9)}
.pl-head p{margin:3px 0 0;color:var(--mut)}
.pl-body{display:grid;grid-template-columns:350px 1fr;gap:18px;padding:18px 22px 22px}
.pl-side .sec,.pl-main .sec{margin-bottom:12px}
.pl-main .fplan{max-height:66vh}
.pl-main .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* misc */
#tip{position:fixed;z-index:45;pointer-events:none;background:var(--g9);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:500;box-shadow:var(--sh2);white-space:nowrap}
#tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 6px 0 2px}
#toast{position:fixed;left:50%;top:86px;transform:translate(-50%,-8px);opacity:0;z-index:60;background:var(--g9);color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:var(--sh);transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:100;background:var(--iv);display:grid;place-items:center;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading .in{text-align:center}#loading .logo{width:56px;height:56px;font-size:22px;margin:0 auto 14px;border-radius:14px}
#loading p{color:var(--mut);margin:6px 0 0}
.bar{width:160px;height:3px;background:var(--ln);border-radius:3px;margin:14px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:var(--g7);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* responsive */
@media (max-width:1100px){#tb button{min-width:50px}.search input{width:110px}}
@media (max-width:760px){
 #tl{top:10px;left:10px;right:10px;gap:6px}
 .brand{padding:6px 10px 6px 6px;gap:8px}.brand small{display:none}.brand h1{font-size:14px}.logo{width:32px;height:32px;font-size:13px;border-radius:9px}
 .search{flex:1;min-width:0}.search input{width:100%;min-width:0}
 #tb{top:62px;left:10px;right:10px;justify-content:space-between;padding:4px}
 #tb button{min-width:0;flex:1;font-size:10px;padding:6px 2px 5px}#tb .sep{display:none}
 .pop{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:18px 18px 0 0;max-height:72vh;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
 #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:64vh;border-radius:18px 18px 0 0;transition:height .25s ease}
 #panel.peek{height:30vh}
 .handle{display:block;width:100%;padding:8px 0 2px;position:sticky;top:0;z-index:3;background:var(--iv)}
 .handle span{display:block;width:42px;height:5px;border-radius:3px;background:#d8d0bd;margin:0 auto}
 .ph{top:19px;padding:6px 16px 8px}.pno{font-size:38px}
 body.has-panel #legend{display:none}
 #legend{left:10px;bottom:10px}.compass{width:54px;height:54px}.legend{padding:8px 11px;min-width:0}.legend .fine{display:none}
 #fab{right:10px;bottom:10px;padding:6px 6px 6px 10px}#fab .txt{display:none}
 .pv-ctl{bottom:auto;top:116px;right:10px}body.has-panel .pv-ctl{right:10px}
 #planner{padding:0}.pl-card{max-height:100%;height:100%;border-radius:0}.pl-body{grid-template-columns:1fr;padding:14px}.pl-head{padding:14px}
 .pl-main .two{grid-template-columns:1fr}
 #wk-top{top:116px;left:10px;right:10px;transform:none;max-width:none;justify-content:space-between;padding-left:12px}#wk-top>div{min-width:0}#wk-top small{max-width:none}#wkSpeed{display:none}
 #wk-map{width:120px;height:146px;top:178px;bottom:auto;left:10px}
 body.walking.touch #wk-map{left:10px;right:auto}
 #wk-hint{display:none}body.walking #panel{display:none}
 #toast{top:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loading"><div class="in"><div class="logo">GV</div><b style="font:600 18px var(--fd);color:var(--g9)">Green Valley Layout</b><p>Preparing the site…</p><div class="bar"><i></i></div></div></div>
<div id="stage" aria-label="3D view of the residential layout"></div>

function setPvb(){const s=$('#pvSvg');if(s)s.setAttribute('viewBox',`${pvb.x} ${pvb.y} ${pvb.w} ${pvb.h}`)}
function pvScale(){const el=$('#planView');return Math.max(pvb.w/el.clientWidth,pvb.h/el.clientHeight)}
function pvZoom(f,cx,cy){const nw=clamp(pvb.w*f,70,900),k=nw/pvb.w;if(cx==null){cx=pvb.x+pvb.w/2;cy=pvb.y+pvb.h/2}pvb={x:cx-(cx-pvb.x)*k,y:cy-(cy-pvb.y)*k,w:nw,h:pvb.h*k};setPvb()}
function pvCenter(p){const w=Math.min(pvb.w,240),k=w/pvb.w;pvb={x:p.cx-w/2+(state.sel&&!small()?w*.2:0),y:p.cz-pvb.h*k/2+(small()?pvb.h*k*.22:0),w,h:pvb.h*k};setPvb()}
function initPlanView(){const el=$('#planView');let drag=null;const pts=new Map();
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX,y:e.clientY,m:0};const s=$('#pvSvg');s&&s.classList.add('drag')});
 el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const a=[...pts.values()],other=a.find(v=>v!==pts.get(e.pointerId))||a[0];const d0=Math.hypot(prev[0]-other[0],prev[1]-other[1]),d1=Math.hypot(e.clientX-other[0],e.clientY-other[1]);if(d1>0)pvZoom(d0/d1);drag.m+=99;return}
  const sc=pvScale(),dx=e.clientX-prev[0],dy=e.clientY-prev[1];pvb.x-=dx*sc;pvb.y-=dy*sc;drag.m+=Math.abs(dx)+Math.abs(dy);setPvb()});
 const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);const s=$('#pvSvg');s&&s.classList.remove('drag');
  if(drag&&drag.m<6&&e.type==='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY),g=t&&t.closest('.pp');if(g)select(byN(+g.dataset.n),{fly:false})}};

 el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect(),sc=pvScale(),cx=pvb.x+pvb.w/2+(e.clientX-r.left-r.width/2)*sc,cy=pvb.y+pvb.h/2+(e.clientY-r.top-r.height/2)*sc;pvZoom(e.deltaY>0?1.12:.89,cx,cy)},{passive:false});

function updateSelFrame(){if(!GL)return;const p=state.sel;selFrame.visible=!!p;if(!p)return;const t=1.3,h=.9,y=.45,[a,b,c,d]=[p.x0,p.x1,p.z0,p.z1],ch=selFrame.children;

 const pick=(x,y)=>{mv.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(mv,C);const objs=house?[...plotMeshes,house.g]:plotMeshes;const h=rc.intersectObjects(objs,true)[0];if(!h)return null;return h.object.userData.p||(house?byN(house.n):null)};

  const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];

   if(d1>0)G.d=clamp(G.d*d0/d1,40,1400);panBy(dx/2,dy/2);moved+=99;return}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
  if(state.walk){WK.yaw-=dx*.0045;WK.pit=clamp(WK.pit-dy*.0045,-1.2,1.2)}
  else if(btn===2||e.shiftKey)panBy(dx,dy);else{G.yaw-=dx*.0055;G.pit=clamp(G.pit+dy*.0045,.12,1.52)}});
 const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(e.type==='pointerup'&&moved<6&&!state.walk&&btn===0){const p=pick(e.clientX,e.clientY);if(p)select(p,{fly:true});else if(state.sel&&!small())select(null)}};

 // joystick

 joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});

let hovered=null;function setHover(p){if(hovered===p)return;if(hovered&&hovered!==state.sel)hovered.mat.emissive.setHex(0);hovered=p;if(p&&p!==state.sel)p.mat.emissive.setHex(0x1a1a1a)}
function panBy(dx,dy){const k=G.d*.0016,cy=Math.cos(G.yaw),sy=Math.sin(G.yaw);G.tx=clamp(G.tx-(dx*cy+dy*sy)*k,-120,520);G.tz=clamp(G.tz-(-dx*sy+dy*cy)*k,-360,390)}

/* ---------- walking ---------- */
function collide(x,z,r=1.2){const list=house?siteColliders.concat(house.cols):siteColliders;
 for(let it=0;it<2;it++)for(const b of list){if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r){const dl=x-(b.x0-r),dr=(b.x1+r)-x,dt=z-(b.z0-r),db=(b.z1+r)-z,m=Math.min(dl,dr,dt,db);if(m===dl)x=b.x0-r;else if(m===dr)x=b.x1+r;else if(m===dt)z=b.z0-r;else z=b.z1+r}}return[x,z]}
let whereT=0;
function stepWalk(dt){
 const fw=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)-WK.jy,sr=(K.KeyD?1:0)-(K.KeyA?1:0)+WK.jx;
 WK.yaw+=((K.ArrowLeft||K.KeyQ?1:0)-(K.ArrowRight||K.KeyE?1:0))*1.7*dt;
 const inH=house&&WK.x>house.fpw.x0&&WK.x<house.fpw.x1&&WK.z>house.fpw.z0&&WK.z<house.fpw.z1;
 const sp=(K.ShiftLeft||K.ShiftRight?2:1)*[6,11,18][WK.speed]*(inH?.55:1)*dt;
 let nx=WK.x+(-Math.sin(WK.yaw)*fw+Math.cos(WK.yaw)*sr)*sp,nz=WK.z+(-Math.cos(WK.yaw)*fw-Math.sin(WK.yaw)*sr)*sp;
 nx=clamp(nx,2,398);nz=clamp(nz,-238,268);[nx,nz]=collide(nx,nz,inH?.75:1.2);WK.x=nx;WK.z=nz;
 let base=PLOTS.some(p=>nx>p.x0&&nx<p.x1&&nz>p.z0&&nz<p.z1)?.5:0;if(house&&nx>house.fpw.x0&&nx<house.fpw.x1&&nz>house.fpw.z0&&nz<house.fpw.z1)base=2;
 WK.y=lerp(WK.y,base+5.5,Math.min(1,dt*10));C.position.set(WK.x,WK.y,WK.z);C.rotation.set(WK.pit,WK.yaw,0,'YXZ');
 const me=$('#wkMe');if(me)me.setAttribute('transform',`translate(${WK.x.toFixed(1)} ${WK.z.toFixed(1)}) rotate(${(-WK.yaw*180/Math.PI).toFixed(1)})`);
 whereT-=dt;if(whereT<0){whereT=.25;const p=PLOTS.find(p=>WK.x>p.x0&&WK.x<p.x1&&WK.z>p.z0&&WK.z<p.z1);let w,s;
  const room=house&&p&&p.n===house.n?(()=>{const q=toLocal(p,WK.x,WK.z);return house.plan.levels[0].rooms.find(r=>q.lx>r.x0&&q.lx<r.x1&&q.ly>r.y0&&q.ly<r.y1)})():null;
  if(room){w=`Inside: ${room.n}`;s=`Plot ${p.n} concept house · ${ftin(room.x1-room.x0)} × ${ftin(room.y1-room.y0)} · ground floor`}
  else if(p){w=`You’re on Plot ${p.n}`;s=`${FACE[p.face]} facing · ${p.W}×${p.D} ft · ${p.status}${house&&house.n===p.n?' · concept house shown':''}`}
  else if(WK.x<PARK.x1&&WK.z>PARK.z0){w='Children’s park';s='Walking track, playground and club house'}
  else{const r=ROADS.find(r=>WK.x>=r.x0&&WK.x<=r.x1&&WK.z>=r.z0&&WK.z<=r.z1);w=r?(r.id==='main'?'12 m main road':'9 m internal road'):PROJECT.name;s=r?'Plot frontages along this road':'Exploring the layout'}
  if($('#wkWhere').textContent!==w)$('#wkWhere').textContent=w;$('#wkSub').textContent=s}
}
function stepOrbit(dt){const k=Math.min(1,dt*5.5);for(const q in G)V[q]+=(G[q]-V[q])*k;const cp=Math.cos(V.pit);
 C.position.set(V.tx+V.d*Math.sin(V.yaw)*cp,Math.max(4,V.d*Math.sin(V.pit)),V.tz+V.d*Math.cos(V.yaw)*cp);C.lookAt(V.tx,0,V.tz)}
let lastYaw=99,tpulse=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1);
 if(state.mode==='plan'&&!state.walk)return;
 cars.forEach(c=>{c.position.z+=c.userData.d*38*dt;if(c.position.z>700)c.position.z=-700;if(c.position.z<-700)c.position.z=700});
 if(state.anim){let h=state.hour+dt*.6;if(h>18){h=18;state.anim=false;renderSun()}setSun(h)}
 state.walk?stepWalk(dt):stepOrbit(dt);
 const yaw=state.walk?WK.yaw:V.yaw;if(Math.abs(yaw-lastYaw)>.002){lastYaw=yaw;labels.forEach(l=>l.rotation.y=yaw);$('#needle').setAttribute('transform',`rotate(${(yaw*180/Math.PI).toFixed(1)})`)}
 if(state.sel){tpulse+=dt;const v=(Math.sin(tpulse*3)*.5+.5)*.14;state.sel.mat.emissive.setRGB(v*.9,v*.75,v*.3)}
 R.render(S,C)}
